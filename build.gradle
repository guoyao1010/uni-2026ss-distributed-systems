 * This is a general purpose Gradle build.
 * Learn more about Gradle by exploring our Samples at https://docs.gradle.org/9.3.1/samples
 */
plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Make Gradle can read proto file and generate the java code
repositories {
    mavenCentral()
}

// Download dependencies of gRPC from Maven Central
dependencies {
    implementation 'io.grpc:grpc-netty-shaded:1.78.0'
    implementation 'io.grpc:grpc-protobuf:1.78.0'
    implementation 'io.grpc:grpc-stub:1.78.0'

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

// For fixing the gradle build issue when running the gRPC version.
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.8'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.78.0'
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Run the RMI server
tasks.register('runRmiServer', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.rmi.socialmedia.DSGSocialMediaServer'
    systemProperty 'java.rmi.server.hostname', project.findProperty('rmiHost') ?: 'h5129.pi.uni-bamberg.de'
}

// Run the gRPC server
tasks.register('runGrpcServer', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.grpc.SocialNetworkServer'
}

// Run the shared client for both RMI and gRPC
tasks.register('runSocialMediaClient', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.DSGSocialMediaClient'
    standardInput = System.in
}

// Run the benchmark client
tasks.register('runBenchmark', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.DSGSocialMediaBenchmarkClient'
}