 * This is a general purpose Gradle build.
 * Learn more about Gradle by exploring our Samples at https://docs.gradle.org/9.3.1/samples
 */
plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Make Gradle can read proto file and generate the java code
repositories {
    mavenCentral()
}

// Download dependencies of gRPC from Maven Central
dependencies {
    implementation 'io.grpc:grpc-netty-shaded:1.64.0'
    implementation 'io.grpc:grpc-protobuf:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

// For fixing the gradle build issue when running the gRPC version.
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.64.0'
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// For run the gRPC server and client with shorter commands
tasks.register('printRuntimeClasspath') {
    doLast {
        println project.sourceSets.main.runtimeClasspath.asPath
    }
}

tasks.register('runGrpcServer', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.grpc.SocialNetworkServer'
}

tasks.register('runGrpcClient', JavaExec) {
    classpath = project.sourceSets.main.runtimeClasspath
    mainClass = 'dsg.grpc.SocialNetworkClient'
    standardInput = System.in
}